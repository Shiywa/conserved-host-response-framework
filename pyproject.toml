[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conserved-host-response-framework"
version = "0.1.0"
description = "Configuration-driven construction, freezing, scoring, and validation of conserved host-response frameworks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Liu Jing"},
  {name = "Wang Shiyou"},
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Shiywa/conserved-host-response-framework"
Repository = "https://github.com/Shiywa/conserved-host-response-framework"
Issues = "https://github.com/Shiywa/conserved-host-response-framework/issues"

[project.scripts]
chrf = "conserved_host_response.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
