[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conserved-host-response-framework"
version = "0.2.0"
description = "Frozen signed CRRM388 definition, scoring, and reproducible RSV manuscript analyses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Liu Jing"},
  {name = "Wang Shiyou"},
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Shiywa/conserved-host-response-framework"
Repository = "https://github.com/Shiywa/conserved-host-response-framework"
Issues = "https://github.com/Shiywa/conserved-host-response-framework/issues"

[project.scripts]
chrf = "conserved_host_response.cli:main"
crrm388 = "conserved_host_response.current_cli:main"

[project.optional-dependencies]
study = ["matplotlib>=3.10,<3.11"]
atlas = ["anndata", "pyarrow", "h5py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
