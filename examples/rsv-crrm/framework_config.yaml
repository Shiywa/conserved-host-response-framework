framework:
  name: CRRM
  disease: respiratory_syncytial_virus
  version: 1.0.0

columns:
  gene: gene
  module: module
  direction: human_consensus_direction

construction:
  anchor_datasets:
    - GSE155237
    - GSE166161
  conservation_systems:
    - mouse
    - cotton_rat
    - organoid
  minimum_primary_anchor_datasets: 1
  minimum_conservation_systems: 2

scoring:
  method: mean_gene_zscore
  weights: equal
  zscore_scope: within_dataset
  zscore_ddof: 1
  invert_down_genes: false
  missing_gene_policy: available_gene_mean
  minimum_coverage_policy: report_only
  interpretation: relative_within_dataset_not_absolute_cross_platform

